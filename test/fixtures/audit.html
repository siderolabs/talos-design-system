<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Audit fixture</title>
<style>
  @font-face { font-family: Remote; src: url(https://fonts.example.invalid/remote.woff2) format('woff2'); }
  :root { --talos-surface-page: #F2EDE8; --talos-content-default: #3A3A38; }
  body { margin: 0; padding: 24px; font-family: Arial, sans-serif; font-size: 14px; color: #3A3A38; background: #F2EDE8; }
  .label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; }
  .centred { width: 200px; margin: 0 auto; }
  .percent { padding: 5%; }
  .hairline { padding: 1px; }
  .row { display: flex; gap: 2px; }
</style>
</head>
<body>
  <p style="margin: 0; font-size: 9px">Nine pixels</p>
  <p style="margin: 0; font-size: 10px">Ten pixels, not a label</p>
  <p style="margin: 0" class="label">Tracked label</p>
  <p style="margin: 0; font-size: 13px">Thirteen pixels</p>
  <div style="padding: 18px">Eighteen pixels of padding</div>
  <div class="centred">Centred with auto margins</div>
  <div class="percent">Percentage padding</div>
  <div class="hairline">Hairline padding</div>
  <div class="row"><span>a</span><span>b</span></div>
  <p style="margin: 0; color: #123456">Off-token colour</p>
</body>
</html>
