# Two things can go wrong in a token repo, and both are quiet.
#
# A value can drop below its contrast threshold, which nobody notices until a
# customer does. And dist/ can fall behind tokens/, which is worse: consumers
# read the committed artifacts, so a forgotten rebuild ships a stylesheet that
# disagrees with its own source and the repo starts lying about what it is.
#
# The tests cover the lint rules, the page audit and the bundled types. Each
# suite skips itself when its tool is missing, so the job installs the dev
# dependencies and Chromium first; without them the tests pass by not running.

name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build and audit contrast
        run: npm run check

      - name: dist/ matches tokens/
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ does not match tokens/. Run 'npm run build' and commit the result."
            git diff --stat -- dist
            git diff -- dist
            exit 1
          fi
          echo "dist/ is current."

      - name: Install Chromium for the page audit
        run: npx playwright install --with-deps chromium

      - name: Test lint rules, types and audit
        run: npm test
